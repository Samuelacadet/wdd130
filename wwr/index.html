<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body class="site1">
    <header>
        <img src="images/logo.jpg" alt="logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="trips.html">trips</a>
            <a href="about.html">Site Plan</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <img src="images/hero.png" alt="homepage" class="hero-img">

            <h1>Adventure is waiting</h1>
            <p>Find the perfect trip for you on our dedicated page</p>
            <button onclick="window.location.href='trips.html';">
                Book Now
            </button>

        </section>

        <form class="contact-form">
            <div class="row">
                <label for="username">Name</label>
                <input type="text" id="username" name="username" placeholder="Your name" required>
            </div>
            <div class="row">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Your email" required>
            </div>
            <button type="submit">Subscribe</button>
        </form>


        <section class="box">
            <h2>Have fun with us!</h2>
            <div class="images">
                <figure>
                    <img src="images/homepage1.jpg" alt="receptionist">
                    <figcaption></figcaption>
                </figure>
                <figure>
                    <img src="images/homepage2.jpg" alt="guide">
                    <figcaption></figcaption>
                </figure>
                <figure>
                    <img src="images/homepage3.jpg" alt="interpreter">
                    <figcaption></figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>©2025 💫Water Rafting travel and co💫Samuela Cadet💫</p>
        <nav class="socialmedia">
            <a href="#"><img src="images/pinterest.svg" alt="pinterest"></a>
            <a href="#"><img src="images/linkedin.svg" alt="linkedin"></a>
            <a href="#"><img src="images/instagram.svg" alt="instagram"></a>
        </nav>
    </footer>
</body>

</html>
