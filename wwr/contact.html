<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="contact about the rafting and co contact us info learn more">
    <meta name="author" content="Samuela Marie Dedjie Cadet">
    <title>Contact Us and Water Rafting and co</title>
    <link rel="stylesheet" href="styles/rafting.css">

</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="logo">
        <nav class="grid-container">
            <div class="item"><a href="index.html">Home</a></div>
            <div class="item"><a href="about.html">About Us</a></div>
            <div class="item"> <a href="trips.html">Trips</a></div>
            <div class="item"> <a href="contact.html">Contact Us</a></div>
        </nav>
    </header>



    <main>
        <h1>Contact us</h1>

        <p>123 Main River street</p>
        <p>Kolob,California</p>
        <p>+ 1 999 999 9999</p>
        <p> info@waterrafting.com</p>


        <div class="contact-container">

            <div class="map">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d52091.309777933515!2d-113.16735745706623!3d37.42476606621447!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sma!4v1764478426155!5m2!1sen!2sma"></iframe>
            </div>
            <form class="contact-form">
                <div class="row">
                    <label for="username">Name</label>
                    <input type="text" id="username" name="username" placeholder="Your name">
                </div>

                <div class="row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Your email">
                </div>

                <div class="row purpose-row">
                    <label class="purpose-title">Message Purpose:</label>

                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="messagePurpose" value="General Inquiry" checked>
                            General Inquiry
                        </label>

                        <label class="radio-option">
                            <input type="radio" name="messagePurpose" value="Reservation Question">
                            Reservation Question
                        </label>

                        <label class="radio-option">
                            <input type="radio" name="messagePurpose" value="Other">
                            Other
                        </label>
                    </div>
                </div>

                <label class="newsletter">
                    <input type="checkbox" name="Subscribe" id="Subscribe">
                    Please Subscribe me to the monthly newsletter
                </label>

                <button type="Submit">Get in Touch!</button>
            </form>
        </div>

        <section class="box">
            <h2>We are here to serve you!</h2>

            <div class="employees">
                <figure>
                    <img src="images/employee1.jpg" alt="receptionnist">
                    <figcaption>Marcus Jean</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="guide">
                    <figcaption>Pierre Luc</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="interpreter">
                    <figcaption>Waldeen Judes</figcaption>
                </figure>
            </div>
        </section>



    </main>

    <footer>
        <p>©2025 💫Water Rafting travel and co💫Samuela Cadet💫 </p>
        <nav class="socialmedia">
            <a href="https://pinterest.com">
                <img src="images/pinterest.svg" alt="pinterest Icon">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="linkedin Icon">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
