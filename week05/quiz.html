<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main>
        <h1>HTML quiz</h1>
        <form>
            <label for="css's definition">1- What does the acronym CSS stand for?</label>
            <input type="text" id="q1" name="q1">
            <label for="class and attribute">2- How class and attributes selected in CSS?</label>
            <input type="textarea" id="q2" name="q2">
            <label for="valid comment">3- Which of the following is a valid css comment?</label>
            <select name="q3" id="q3" placeholder="Choose One...">
                <option value="1"><!--comment--></option>
                <option value="2">/*comment*/</option>
                <option value="3">*!comment!*</option>
            </select>
            <label for="Bottom margin"></label>
            <input type="number" name="q4" id="q4">
            <button type="submit">Submit</button>

        </form>
    </main>

</body>

</html>
